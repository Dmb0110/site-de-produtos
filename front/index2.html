<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do produto</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
        }

        .voltar {
            color: #155eef;
            font-weight: bold;
        }

        main {
            width: min(92%, 560px);
            margin: 64px auto 0;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #dce3ee;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
        }

        dt {
            margin-top: 20px;
            color: #5c667a;
        }

        dd {
            margin: 6px 0 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #status {
            color: #5c667a;
        }

        .erro {
            color: #b42318;
        }
    </style>
    <link rel="stylesheet" href="/front/styles.css">
</head>
<body>
    <a class="voltar" href="index.html">&#8592; Voltar</a>

    <main>
        <h1>Detalhes do produto</h1>
        <p id="status">Carregando...</p>
        <dl id="detalhes" hidden>
            <dt>Nome</dt>
            <dd id="nome"></dd>
            <dt>Preço</dt>
            <dd id="preco"></dd>
        </dl>
    </main>

    <script>
        const status = document.querySelector('#status');
        const detalhes = document.querySelector('#detalhes');
        const parametros = new URLSearchParams(window.location.search);
        const produtoId = parametros.get('id');
        const nome = parametros.get('nome');
        const preco = parametros.get('preco');

        async function carregarDetalhes() {
            if (!produtoId || !nome || preco === null) {
                status.textContent = 'Produto inválido.';
                status.classList.add('erro');
                return;
            }

            try {
                const resposta = await fetch(`http://127.0.0.1:5000/produtos/${produtoId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nome, preco: Number(preco) }),
                });

                if (!resposta.ok) {
                    throw new Error(`A API respondeu com status ${resposta.status}.`);
                }

                const produto = await resposta.json();
                document.querySelector('#nome').textContent = produto.nome;
                document.querySelector('#preco').textContent = `R$ ${Number(produto.preco).toFixed(2)}`;
                status.hidden = true;
                detalhes.hidden = false;
            } catch (erro) {
                status.textContent = 'Não foi possível carregar os detalhes do produto.';
                status.classList.add('erro');
                console.error(erro);
            }
        }

        carregarDetalhes();
    </script>
</body>
</html>
