<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Projeto 5</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .menu-container {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 2;
        }

        .menu-botao {
            width: 48px;
            height: 48px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: #ffffff;
            color: #172033;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .menu-opcoes {
            display: none;
            width: 220px;
            margin-top: 8px;
            padding: 8px;
            background: #ffffff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.12);
        }

        .menu-opcoes.aberto {
            display: grid;
            gap: 4px;
        }

        .menu-opcoes a {
            display: block;
            padding: 10px;
            color: #172033;
            font-size: 1rem;
            text-decoration: none;
        }

        .menu-opcoes a:hover {
            background: #f4f7fb;
        }

        main {
            width: min(92%, 560px);
            padding: 32px;
            background: #ffffff;
            border: 1px solid #dce3ee;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        #status {
            color: #5c667a;
        }

        ul {
            padding-left: 0;
            list-style: none;
        }

        li {
            margin: 10px 0;
        }

        a {
            color: #155eef;
            font-size: 1.1rem;
        }

        .erro {
            color: #b42318;
        }
    </style>
    <link rel="stylesheet" href="/front/styles.css">
</head>
<body class="pagina-produtos">
    <div class="menu-container">
        <button class="menu-botao" id="menu-botao" type="button" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
        <nav class="menu-opcoes" id="menu-opcoes" aria-label="Opções de produtos">
            <a href="/front/cadastrar.html">Cadastrar produto</a>
            <a href="/front/colocar-foto.html">Colocar foto</a>
            <a href="/front/editar.html">Trocar nome ou preço</a>
            <a href="/front/deletar.html">Deletar produto</a>
        </nav>
    </div>

    <header class="topo">
        <form class="barra-busca" id="formulario-busca" role="search">
            <input id="busca" type="search" placeholder="Buscar produtos" autocomplete="off" aria-label="Buscar produtos">
            <button type="submit">Buscar</button>
        </form>
    </header>

    <main>
        <h1>Produtos cadastrados</h1>
        <p id="status">Carregando produtos...</p>
        <ul id="lista-produtos"></ul>
    </main>

    <style>
        .produto-card {
            display: grid;
            gap: 10px;
            padding: 16px;
            border: 1px solid #e4ecf8;
            border-radius: 14px;
            background: #ffffff;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .produto-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(23, 32, 51, 0.08);
        }

        .produto-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            background: #f4f7fb;
        }

        .produto-link {
            font-size: 1.1rem;
            font-weight: 700;
            color: #172033;
            text-decoration: none;
        }

        .produto-preco {
            margin: 0;
            color: #5c667a;
            font-size: 1rem;
        }
    </style>
    <script>
        const menuBotao = document.querySelector('#menu-botao');
        const menuOpcoes = document.querySelector('#menu-opcoes');
        const status = document.querySelector('#status');
        const listaProdutos = document.querySelector('#lista-produtos');
        const formularioBusca = document.querySelector('#formulario-busca');
        const busca = document.querySelector('#busca');
        let produtos = [];

        menuBotao.addEventListener('click', () => {
            const aberto = menuOpcoes.classList.toggle('aberto');
            menuBotao.setAttribute('aria-expanded', aberto);
        });

        function normalizarTexto(valor) {
            return String(valor)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function mostrarProdutos(produtosFiltrados) {
            listaProdutos.innerHTML = '';

            if (produtosFiltrados.length === 0) {
                status.textContent = produtos.length === 0
                    ? 'Nenhum produto cadastrado.'
                    : 'Nenhum produto encontrado.';
                return;
            }

            produtosFiltrados.forEach((produto) => {
                    const item = document.createElement('li');
                    const card = document.createElement('article');
                    card.className = 'produto-card';

                    if (produto.foto) {
                        const imagem = document.createElement('img');
                        imagem.src = produto.foto;
                        imagem.alt = produto.nome;
                        card.appendChild(imagem);
                    }

                    const link = document.createElement('a');
                    link.className = 'produto-link';
                    link.href = `/front/index2.html?id=${produto.id}`;
                    link.textContent = produto.nome;
                    card.appendChild(link);

                    const preco = document.createElement('p');
                    preco.className = 'produto-preco';
                    preco.textContent = `R$ ${Number(produto.preco).toFixed(2)}`;
                    card.appendChild(preco);

                    item.appendChild(card);
                    listaProdutos.appendChild(item);
            });

            status.textContent = `${produtosFiltrados.length} produto(s) encontrado(s).`;
        }

        function filtrarProdutos() {
            const termo = normalizarTexto(busca.value.trim());
            const produtosFiltrados = termo
                ? produtos.filter((produto) => normalizarTexto(produto.nome).includes(termo))
                : produtos;
            mostrarProdutos(produtosFiltrados);
        }

        formularioBusca.addEventListener('submit', (evento) => {
            evento.preventDefault();
            filtrarProdutos();
        });

        busca.addEventListener('input', filtrarProdutos);

        async function carregarProdutos() {
            try {
                const resposta = await fetch('/produtos');

                if (!resposta.ok) {
                    throw new Error(`A API respondeu com status ${resposta.status}.`);
                }

                produtos = await resposta.json();

                if (!Array.isArray(produtos)) {
                    throw new Error('A API retornou uma resposta inv\u00e1lida.');
                }

                filtrarProdutos();
            } catch (erro) {
                status.textContent = 'Não foi possível carregar os produtos.';
                status.classList.add('erro');
                console.error(erro);
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
