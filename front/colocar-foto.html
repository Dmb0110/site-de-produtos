<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocar foto no produto</title>
    <style>
        :root { font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
        body { margin: 0; padding: 24px; }
        .voltar { color: #155eef; font-weight: bold; }
        main { width: min(92%, 560px); margin: 64px auto 0; padding: 32px; background: #fff; border: 1px solid #dce3ee; border-radius: 8px; box-shadow: 0 12px 32px rgba(23, 32, 51, .08); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 6px; font-weight: bold; }
        select, input, button { box-sizing: border-box; padding: 11px; border: 1px solid #b8c2d1; border-radius: 6px; font: inherit; }
        button { background: #155eef; color: #fff; border: 0; cursor: pointer; }
        #status { color: #5c667a; }
        .erro { color: #b42318 !important; }
        .sucesso { color: #067647 !important; }
    </style>
    <link rel="stylesheet" href="/front/styles.css">
</head>
<body>
    <a class="voltar" href="index.html">&#8592; Voltar</a>
    <main>
        <h1>Colocar foto</h1>
        <p id="status">Carregando produtos...</p>
        <form id="formulario" hidden>
            <label for="produto">Produto
                <select id="produto" required></select>
            </label>
            <label for="foto">Foto
                <input id="foto" type="file" accept="image/*" required>
            </label>
            <button type="submit">Salvar foto</button>
        </form>
    </main>
    <script>
        const formulario = document.querySelector('#formulario');
        const produtoSelect = document.querySelector('#produto');
        const fotoInput = document.querySelector('#foto');
        const status = document.querySelector('#status');

        function lerFoto(arquivo) {
            return new Promise((resolve, reject) => {
                const leitor = new FileReader();
                leitor.onload = () => resolve(leitor.result);
                leitor.onerror = () => reject(new Error('N\u00e3o foi poss\u00edvel ler a foto selecionada.'));
                leitor.readAsDataURL(arquivo);
            });
        }

        function mostrarSemProdutos() {
            formulario.hidden = true;
            status.hidden = false;
            status.className = '';
            status.textContent = 'Todos os produtos j\u00e1 possuem foto.';
        }

        async function carregarProdutos() {
            try {
                const resposta = await fetch('/produtos');
                if (!resposta.ok) throw new Error('N\u00e3o foi poss\u00edvel carregar os produtos.');

                const produtos = await resposta.json();
                produtoSelect.replaceChildren();

                if (produtos.length === 0) {
                    status.hidden = false;
                    status.textContent = 'Nenhum produto encontrado.';
                    status.className = 'erro';
                    formulario.hidden = true;
                    return;
                }

                produtos.forEach((produto) => {
                    const opcao = document.createElement('option');
                    opcao.value = produto.id;
                    opcao.textContent = produto.nome;
                    produtoSelect.appendChild(opcao);
                });

                formulario.hidden = false;
                status.hidden = true;
            } catch (erro) {
                status.hidden = false;
                status.textContent = erro.message;
                status.className = 'erro';
            }
        }

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const arquivo = fotoInput.files[0];
            status.hidden = false;
            status.className = '';

            try {
                if (!arquivo || !arquivo.type.startsWith('image/')) {
                    throw new Error('Selecione um arquivo de imagem v\u00e1lido.');
                }
                if (arquivo.size > 5 * 1024 * 1024) {
                    throw new Error('A foto deve ter no m\u00e1ximo 5 MB.');
                }

                status.textContent = 'Salvando foto...';
                const foto = await lerFoto(arquivo);
                const resposta = await fetch(`/produtos/${produtoSelect.value}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ foto }),
                });

                if (!resposta.ok) throw new Error('N\u00e3o foi poss\u00edvel salvar a foto.');

                produtoSelect.options[produtoSelect.selectedIndex].remove();
                fotoInput.value = '';
                if (produtoSelect.options.length === 0) {
                    mostrarSemProdutos();
                    return;
                }

                status.textContent = 'Foto adicionada com sucesso.';
                status.className = 'sucesso';
            } catch (erro) {
                status.textContent = erro.message;
                status.className = 'erro';
            }
        });

        carregarProdutos();
    </script>
</body>
</html>
