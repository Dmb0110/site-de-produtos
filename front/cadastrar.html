<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto</title>
    <style>
        :root { font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
        body { margin: 0; padding: 24px; }
        .voltar { color: #155eef; font-weight: bold; }
        main { width: min(92%, 560px); margin: 64px auto 0; padding: 32px; background: #fff; border: 1px solid #dce3ee; border-radius: 12px; box-shadow: 0 12px 32px rgba(23, 32, 51, .08); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 6px; font-weight: bold; }
        input, button { box-sizing: border-box; padding: 11px; border: 1px solid #b8c2d1; border-radius: 6px; font: inherit; }
        button { background: #155eef; color: #fff; border: 0; cursor: pointer; }
        #status { color: #5c667a; }
        .erro { color: #b42318 !important; }
        .sucesso { color: #067647 !important; }
    </style>
    <link rel="stylesheet" href="/front/styles.css">
</head>
<body>
    <a class="voltar" href="index.html">&#8592; Voltar</a>
    <main>
        <h1>Cadastrar produto</h1>
        <form id="formulario">
            <label for="nome">Nome
                <input id="nome" name="nome" required maxlength="100">
            </label>
            <label for="preco">Preço
                <input id="preco" name="preco" type="number" min="0" step="0.01" required>
            </label>
            <label for="foto">Foto (opcional)
                <input id="foto" name="foto" type="file" accept="image/*">
            </label>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="status"></p>
    </main>
    <script>
        const formulario = document.querySelector('#formulario');
        const status = document.querySelector('#status');

        function lerFoto(arquivo) {
            return new Promise((resolve, reject) => {
                const leitor = new FileReader();
                leitor.onload = () => resolve(leitor.result);
                leitor.onerror = () => reject(new Error('N\u00e3o foi poss\u00edvel ler a foto selecionada.'));
                leitor.readAsDataURL(arquivo);
            });
        }

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            status.textContent = 'Cadastrando...';
            status.className = '';

            try {
                const arquivo = formulario.foto.files[0];
                if (arquivo && !arquivo.type.startsWith('image/')) {
                    throw new Error('Selecione um arquivo de imagem v\u00e1lido.');
                }
                if (arquivo && arquivo.size > 5 * 1024 * 1024) {
                    throw new Error('A foto deve ter no m\u00e1ximo 5 MB.');
                }

                const produto = {
                    nome: formulario.nome.value.trim(),
                    preco: Number(formulario.preco.value),
                };

                if (arquivo) {
                    produto.foto = await lerFoto(arquivo);
                }

                const resposta = await fetch('/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto),
                });

                if (!resposta.ok) throw new Error('Não foi possível cadastrar o produto.');
                formulario.reset();
                status.textContent = 'Produto cadastrado com sucesso.';
                status.className = 'sucesso';
            } catch (erro) {
                status.textContent = erro.message;
                status.className = 'erro';
            }
        });
    </script>
</body>
</html>
