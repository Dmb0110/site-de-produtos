<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto</title>
    <style>
        :root { font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
        body { margin: 0; padding: 24px; }
        .voltar { color: #155eef; font-weight: bold; }
        main { width: min(92%, 560px); margin: 64px auto 0; padding: 32px; background: #fff; border: 1px solid #dce3ee; border-radius: 12px; box-shadow: 0 12px 32px rgba(23, 32, 51, .08); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 6px; font-weight: bold; }
        input, button { box-sizing: border-box; padding: 11px; border: 1px solid #b8c2d1; border-radius: 6px; font: inherit; }
        button { background: #155eef; color: #fff; border: 0; cursor: pointer; }
        #status { color: #5c667a; }
        .erro { color: #b42318 !important; }
        .sucesso { color: #067647 !important; }
    </style>
    <link rel="stylesheet" href="/front/styles.css">
</head>
<body>
    <a class="voltar" href="index.html">&#8592; Voltar</a>
    <main>
        <h1>Cadastrar produto</h1>
        <form id="formulario">
            <label for="nome">Nome
                <input id="nome" name="nome" required maxlength="100">
            </label>
            <label for="preco">Preço
                <input id="preco" name="preco" type="number" min="0" step="0.01" required>
            </label>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="status"></p>
    </main>
    <script>
        const formulario = document.querySelector('#formulario');
        const status = document.querySelector('#status');

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            status.textContent = 'Cadastrando...';
            status.className = '';

            try {
                const resposta = await fetch('http://127.0.0.1:5000/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: formulario.nome.value.trim(),
                        preco: Number(formulario.preco.value),
                    }),
                });

                if (!resposta.ok) throw new Error('Não foi possível cadastrar o produto.');
                formulario.reset();
                status.textContent = 'Produto cadastrado com sucesso.';
                status.className = 'sucesso';
            } catch (erro) {
                status.textContent = erro.message;
                status.className = 'erro';
            }
        });
    </script>
</body>
</html>
